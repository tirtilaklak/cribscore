name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run validate:worker
      # The manifest is gitignored; keep the build receipt with the run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-build-manifest
          path: docs/worker-build-manifest.json
          if-no-files-found: ignore
